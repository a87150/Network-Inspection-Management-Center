{% comment %}
PC 顶部三个方块：标题行左标题右角标、大总数带单位、细项用正文档字号、入口沉在右下角。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="PC 视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'assets' %} border-primary{% endif %}" type="button"
                id="pc-tab-assets" data-bs-toggle="tab" data-bs-target="#pc-pane-assets"
                role="tab" aria-controls="pc-pane-assets" aria-selected="{% if pc_tab == 'assets' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1" style="width:100%">
                <div class="metric-card__status-row mb-3" style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%">
                    <h2 class="h5 mb-0">PC 资产</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ overview.total|default:0 }}<span class="metric__unit">台</span></div>
                <div class="metric-card__detail mt-2">活跃 <span class="text-success">{{ overview.active|default:0 }}</span> · 停用 <span class="{% if overview.inactive %}text-danger{% endif %}">{{ overview.inactive|default:0 }}</span></div>
                <div class="metric-card__detail mt-1">活跃率 {{ overview.active_rate|default:0 }}%</div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看 PC 资产{% if pc_tab == 'assets' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'analyses' %} border-primary{% endif %}" type="button"
                id="pc-tab-analyses" data-bs-toggle="tab" data-bs-target="#pc-pane-analyses"
                role="tab" aria-controls="pc-pane-analyses" aria-selected="{% if pc_tab == 'analyses' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1" style="width:100%">
                <div class="metric-card__status-row mb-3" style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%">
                    <h2 class="h5 mb-0">分析记录</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>快照</span>
                </div>
                <div class="metric">{{ pc_analyses_total|default:0 }}<span class="metric__unit">条</span></div>
                <div class="metric-card__detail mt-2">覆盖 PC <span class="text-success">{{ pc_analyses_computers|default:0 }}</span> 台</div>
                <div class="metric-card__detail mt-1">采集异常 <span class="{% if pc_errors_total %}text-danger{% endif %}">{{ pc_errors_total|default:0 }}</span> 台</div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看分析记录{% if pc_tab == 'analyses' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'logs' %} border-primary{% endif %}" type="button"
                id="pc-tab-logs" data-bs-toggle="tab" data-bs-target="#pc-pane-logs"
                role="tab" aria-controls="pc-pane-logs" aria-selected="{% if pc_tab == 'logs' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1" style="width:100%">
                <div class="metric-card__status-row mb-3" style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%">
                    <h2 class="h5 mb-0">日志</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>采集</span>
                </div>
                <div class="metric">{{ pc_logs_total|default:0 }}<span class="metric__unit">条</span></div>
                <div class="metric-card__detail mt-2">覆盖 PC <span class="text-success">{{ pc_logs_computers|default:0 }}</span> 台</div>
                <div class="metric-card__detail mt-1">采集异常 <span class="{% if pc_errors_total %}text-danger{% endif %}">{{ pc_errors_total|default:0 }}</span> 台</div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看日志{% if pc_tab == 'logs' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
</div>
