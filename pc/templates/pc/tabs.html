{% comment %}
PC 主页面顶部的三个方块：标题行左边标题、右边角标；下面一个大总数 + 细项；入口沉在左下角。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="PC 视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'assets' %} border-primary{% endif %}" type="button"
                id="pc-tab-assets" data-bs-toggle="tab" data-bs-target="#pc-pane-assets"
                role="tab" aria-controls="pc-pane-assets" aria-selected="{% if pc_tab == 'assets' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1">
                <div class="metric-card__status-row mb-3">
                    <h2 class="h5 mb-0">PC 资产</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ overview.total|default:0 }}</div>
                <div class="small mt-2">活跃 <span class="text-success">{{ overview.active|default:0 }}</span> · <span class="{% if overview.inactive %}text-danger{% endif %}">停用 {{ overview.inactive|default:0 }}</span></div>
                <div class="small mt-2">活跃率 {{ overview.active_rate|default:0 }}%</div>
                <div class="small text-primary mt-auto pt-3 text-end">查看 PC 资产{% if pc_tab == 'assets' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'analyses' %} border-primary{% endif %}" type="button"
                id="pc-tab-analyses" data-bs-toggle="tab" data-bs-target="#pc-pane-analyses"
                role="tab" aria-controls="pc-pane-analyses" aria-selected="{% if pc_tab == 'analyses' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1">
                <div class="metric-card__status-row mb-3">
                    <h2 class="h5 mb-0">分析记录</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>快照</span>
                </div>
                <div class="metric">{{ pc_analyses_total|default:0 }}</div>
                <div class="small mt-2">覆盖 PC <span class="text-success">{{ pc_analyses_computers|default:0 }}</span></div>
                <div class="small mt-2">采集异常 <span class="{% if pc_errors_total %}text-danger{% endif %}">{{ pc_errors_total|default:0 }}</span></div>
                <div class="small text-primary mt-auto pt-3 text-end">查看分析记录{% if pc_tab == 'analyses' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if pc_tab == 'logs' %} border-primary{% endif %}" type="button"
                id="pc-tab-logs" data-bs-toggle="tab" data-bs-target="#pc-pane-logs"
                role="tab" aria-controls="pc-pane-logs" aria-selected="{% if pc_tab == 'logs' %}true{% else %}false{% endif %}">
            <div class="card-body d-flex flex-column flex-grow-1">
                <div class="metric-card__status-row mb-3">
                    <h2 class="h5 mb-0">日志</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>采集</span>
                </div>
                <div class="metric">{{ pc_logs_total|default:0 }}</div>
                <div class="small mt-2">覆盖 PC <span class="text-success">{{ pc_logs_computers|default:0 }}</span></div>
                <div class="small mt-2">采集异常 <span class="{% if pc_errors_total %}text-danger{% endif %}">{{ pc_errors_total|default:0 }}</span></div>
                <div class="small text-primary mt-auto pt-3 text-end">查看日志{% if pc_tab == 'logs' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
</div>
