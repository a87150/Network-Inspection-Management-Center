{% comment %}
PC 主页面顶部的三个方块：资产台账、分析记录（跳原页面）、日志（含采集异常）。
和域控管理页同一套样式，整块可点。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="PC 视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body{% if pc_tab == 'assets' %} border-primary{% endif %}" type="button"
                id="pc-tab-assets" data-bs-toggle="tab" data-bs-target="#pc-pane-assets"
                role="tab" aria-controls="pc-pane-assets" aria-selected="{% if pc_tab == 'assets' %}true{% else %}false{% endif %}">
            <div class="card-body">
                <div class="metric-label">PC 资产</div>
                <div class="metric">{{ overview.total|default:'-' }}</div>
                <div class="small mt-2">活跃 {{ overview.active|default:'-' }}（{{ overview.active_rate|default:'-' }}%）</div>
                <div class="small text-secondary mt-1">资产台账、责任人与启用状态</div>
                <div class="small text-primary mt-2">查看 PC 资产{% if pc_tab == 'assets' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body{% if pc_tab == 'analyses' %} border-primary{% endif %}" type="button"
                id="pc-tab-analyses" data-bs-toggle="tab" data-bs-target="#pc-pane-analyses"
                role="tab" aria-controls="pc-pane-analyses" aria-selected="{% if pc_tab == 'analyses' %}true{% else %}false{% endif %}">
            <div class="card-body">
                <div class="metric-label">分析记录</div>
                <div class="metric">{{ pc_analyses_total }}</div>
                <div class="small mt-2">每次采集的软件与硬件快照</div>
                <div class="small text-secondary mt-1">最近 {{ pc_analyses_recent.0.analysis_date|date:'Y-m-d'|default:'暂无' }}</div>
                <div class="small text-primary mt-2">查看分析记录{% if pc_tab == 'analyses' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body{% if pc_tab == 'logs' %} border-primary{% endif %}" type="button"
                id="pc-tab-logs" data-bs-toggle="tab" data-bs-target="#pc-pane-logs"
                role="tab" aria-controls="pc-pane-logs" aria-selected="{% if pc_tab == 'logs' %}true{% else %}false{% endif %}">
            <div class="card-body">
                <div class="metric-label">日志</div>
                <div class="metric">{{ pc_logs_state.total|default:'-' }}</div>
                <div class="small mt-2">采集异常 {{ pc_errors_state.total|default:0 }}</div>
                <div class="small text-secondary mt-1">日志文件清单，上方是采集异常</div>
                <div class="small text-primary mt-2">查看日志{% if pc_tab == 'logs' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
</div>
