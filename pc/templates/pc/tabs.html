{% comment %}
PC 主页面顶部的三个方块。结构和首页 dashboard/card.html 一致：
标题行 + 三列大数字 + 底部动作行，三块等高，没数据时显示 0 而不是「-」。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="PC 视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card glass-card h-100 w-100 text-start text-body d-flex flex-column{% if pc_tab == 'assets' %} border-primary{% endif %}" type="button"
                id="pc-tab-assets" data-bs-toggle="tab" data-bs-target="#pc-pane-assets"
                role="tab" aria-controls="pc-pane-assets" aria-selected="{% if pc_tab == 'assets' %}true{% else %}false{% endif %}">
            <div class="card-body p-4 d-flex flex-column">
                <div class="metric-card__status-row d-flex justify-content-between align-items-start mb-3">
                    <h2 class="h5 mb-0">PC 资产</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="row text-center g-2 metric-card__metrics" role="list" aria-label="PC 资产统计">
                    <div class="col-4"><div class="metric">{{ overview.total|default:0 }}</div><div class="metric-label">总数</div></div>
                    <div class="col-4"><div class="metric text-success">{{ overview.active|default:0 }}</div><div class="metric-label">活跃</div></div>
                    <div class="col-4"><div class="metric">{{ overview.active_rate|default:0 }}%</div><div class="metric-label">活跃率</div></div>
                </div>
            </div>
            <div class="card-footer metric-card__footer metric-card__actions px-4 pb-4 pt-0 border-0 text-primary">
                查看 PC 资产{% if pc_tab == 'assets' %} · 当前{% endif %}
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card glass-card h-100 w-100 text-start text-body d-flex flex-column{% if pc_tab == 'analyses' %} border-primary{% endif %}" type="button"
                id="pc-tab-analyses" data-bs-toggle="tab" data-bs-target="#pc-pane-analyses"
                role="tab" aria-controls="pc-pane-analyses" aria-selected="{% if pc_tab == 'analyses' %}true{% else %}false{% endif %}">
            <div class="card-body p-4 d-flex flex-column">
                <div class="metric-card__status-row d-flex justify-content-between align-items-start mb-3">
                    <h2 class="h5 mb-0">分析记录</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>快照</span>
                </div>
                <div class="row text-center g-2 metric-card__metrics" role="list" aria-label="分析记录统计">
                    <div class="col-4"><div class="metric">{{ pc_analyses_total|default:0 }}</div><div class="metric-label">记录数</div></div>
                    <div class="col-4"><div class="metric">{{ pc_analyses_computers|default:0 }}</div><div class="metric-label">覆盖 PC</div></div>
                    <div class="col-4"><div class="metric">{{ pc_errors_total|default:0 }}</div><div class="metric-label">采集异常</div></div>
                </div>
            </div>
            <div class="card-footer metric-card__footer metric-card__actions px-4 pb-4 pt-0 border-0 text-primary">
                查看分析记录{% if pc_tab == 'analyses' %} · 当前{% endif %}
            </div>
        </button>
    </div>
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card glass-card h-100 w-100 text-start text-body d-flex flex-column{% if pc_tab == 'logs' %} border-primary{% endif %}" type="button"
                id="pc-tab-logs" data-bs-toggle="tab" data-bs-target="#pc-pane-logs"
                role="tab" aria-controls="pc-pane-logs" aria-selected="{% if pc_tab == 'logs' %}true{% else %}false{% endif %}">
            <div class="card-body p-4 d-flex flex-column">
                <div class="metric-card__status-row d-flex justify-content-between align-items-start mb-3">
                    <h2 class="h5 mb-0">日志</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>采集</span>
                </div>
                <div class="row text-center g-2 metric-card__metrics" role="list" aria-label="日志统计">
                    <div class="col-4"><div class="metric">{{ pc_logs_total|default:0 }}</div><div class="metric-label">日志文件</div></div>
                    <div class="col-4"><div class="metric">{{ pc_logs_computers|default:0 }}</div><div class="metric-label">覆盖 PC</div></div>
                    <div class="col-4"><div class="metric">{{ pc_errors_total|default:0 }}</div><div class="metric-label">采集异常</div></div>
                </div>
            </div>
            <div class="card-footer metric-card__footer metric-card__actions px-4 pb-4 pt-0 border-0 text-primary">
                查看日志{% if pc_tab == 'logs' %} · 当前{% endif %}
            </div>
        </button>
    </div>
</div>
