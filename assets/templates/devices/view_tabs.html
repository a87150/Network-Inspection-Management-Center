{% comment %}
非 PC 资产页顶部的大方块，版式与域控管理页一致：一个总数 + 细项 + 入口。
点一下原地切视图，?object= 只用来记住位置。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="{{ item_name }}视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'rows' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'rows' %}true{% else %}false{% endif %}"
                data-view-tab="rows" data-view-url="?object=rows">
            <div class="card-body">
                <div class="metric-label">{{ item_name }}</div>
                <div class="metric">{{ overview.total|default:0 }}</div>
                <div class="small mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · <span class="{% if overview.abnormal %}text-danger{% endif %}">异常 {{ overview.abnormal|default:0 }}</span></div>
                <div class="small text-secondary mt-1">台账范围内的设备清单</div>
                <div class="small text-primary mt-2">查看{{ item_name }}{% if view == 'rows' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% if item_key == 'people' %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'departments' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'departments' %}true{% else %}false{% endif %}"
                data-view-tab="departments" data-view-url="?object=departments">
            <div class="card-body">
                <div class="metric-label">部门</div>
                <div class="metric">{{ department_total|default:0 }}</div>
                <div class="small mt-2">在职 <span class="text-success">{{ overview.normal|default:0 }}</span> · <span class="{% if overview.abnormal %}text-danger{% endif %}">离职 {{ overview.abnormal|default:0 }}</span></div>
                <div class="small text-secondary mt-1">按部门汇总的在册人数</div>
                <div class="small text-primary mt-2">查看部门{% if view == 'departments' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% else %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'records' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'records' %}true{% else %}false{% endif %}"
                data-view-tab="records" data-view-url="?object=records">
            <div class="card-body">
                <div class="metric-label">巡检记录</div>
                <div class="metric">{{ overview.total|default:0 }}</div>
                <div class="small mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · <span class="{% if overview.abnormal %}text-danger{% endif %}">异常 {{ overview.abnormal|default:0 }}</span></div>
                <div class="small text-secondary mt-1">最近一次巡检的逐设备结果</div>
                <div class="small text-primary mt-2">查看巡检记录{% if view == 'records' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% if item_key == 'weakcurrent' %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'access' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'access' %}true{% else %}false{% endif %}"
                data-view-tab="access" data-view-url="?object=access">
            <div class="card-body">
                <div class="metric-label">门禁记录</div>
                <div class="metric">{{ overview.total|default:0 }}</div>
                <div class="small mt-2">在线 <span class="text-success">{{ overview.normal|default:0 }}</span> · <span class="{% if overview.abnormal %}text-danger{% endif %}">异常 {{ overview.abnormal|default:0 }}</span></div>
                <div class="small text-secondary mt-1">门禁设备的进出与状态记录</div>
                <div class="small text-primary mt-2">查看门禁记录{% if view == 'access' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% endif %}
{% endif %}
</div>
