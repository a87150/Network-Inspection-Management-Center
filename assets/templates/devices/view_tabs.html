{% comment %}
非 PC 资产页顶部的大方块，和 PC 页同一套：标题行 + 大总数带单位 + 细项 + 右下入口。
点一下原地切视图，?object= 只用来记住位置。
{% endcomment %}
<div class="row g-3 mb-3" role="tablist" aria-label="{{ item_name }}视图">
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'rows' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'rows' %}true{% else %}false{% endif %}"
                data-view-tab="rows" data-view-url="?object=rows">
            <div class="card-body d-flex flex-column flex-grow-1" style="width:100%">
                <div class="metric-card__status-row mb-3" style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%">
                    <h2 class="h5 mb-0">{{ item_name }}</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ overview.total|default:0 }}<span class="metric__unit">台</span></div>
                <div class="metric-card__detail mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · 异常 <span class="{% if {{ overview.abnormal|default:0 }} %}text-danger{% endif %}">{{ overview.abnormal|default:0 }}</span></div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看{{ item_name }}{% if view == 'rows' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% if item_key == 'people' %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'departments' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'departments' %}true{% else %}false{% endif %}"
                data-view-tab="departments" data-view-url="?object=departments">
            <div class="card-body d-flex flex-column flex-grow-1" style="width:100%">
                <div class="metric-card__status-row mb-3" style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%">
                    <h2 class="h5 mb-0">部门</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ department_total|default:0 }}<span class="metric__unit">个</span></div>
                <div class="metric-card__detail mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · 异常 <span class="{% if {{ overview.abnormal|default:0 }} %}text-danger{% endif %}">{{ overview.abnormal|default:0 }}</span></div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看部门{% if view == 'departments' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% else %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'records' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'records' %}true{% else %}false{% endif %}"
                data-view-tab="records" data-view-url="?object=records">

                    <h2 class="h5 mb-0">巡检记录</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ overview.total|default:0 }}<span class="metric__unit">条</span></div>
                <div class="metric-card__detail mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · 异常 <span class="{% if {{ overview.abnormal|default:0 }} %}text-danger{% endif %}">{{ overview.abnormal|default:0 }}</span></div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看巡检记录{% if view == 'records' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% if item_key == 'weakcurrent' %}
    <div class="col-12 col-md-4">
        <button class="card surface-card metric-card h-100 w-100 text-start text-body border-0{% if view == 'access' %} border-primary{% endif %}" type="button"
                role="tab" aria-selected="{% if view == 'access' %}true{% else %}false{% endif %}"
                data-view-tab="access" data-view-url="?object=access">

                    <h2 class="h5 mb-0">门禁记录</h2>
                    <span class="metric-card__ready"><span class="status-dot status-dot--ok"></span>台账</span>
                </div>
                <div class="metric">{{ overview.total|default:0 }}<span class="metric__unit">条</span></div>
                <div class="metric-card__detail mt-2">正常 <span class="text-success">{{ overview.normal|default:0 }}</span> · 异常 <span class="{% if {{ overview.abnormal|default:0 }} %}text-danger{% endif %}">{{ overview.abnormal|default:0 }}</span></div>
                <div class="metric-card__entry mt-auto pt-3" style="text-align:right;width:100%">查看门禁记录{% if view == 'access' %} · 当前{% endif %}</div>
            </div>
        </button>
    </div>
{% endif %}
{% endif %}
</div>
